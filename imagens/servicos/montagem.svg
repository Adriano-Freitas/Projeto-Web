<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241926"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="rgbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="12" fill="url(#bgGrad3)" stroke="#333338" stroke-width="2"/>
  
  <!-- Gabinete PC Gamer Central -->
  <rect x="230" y="60" width="180" height="210" rx="10" fill="#1b1b22" stroke="#555" stroke-width="3"/>
  <rect x="245" y="75" width="150" height="180" rx="6" fill="#0f0f14" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Coolers RGB -->
  <circle cx="320" cy="115" r="26" fill="#121216" stroke="url(#rgbGrad)" stroke-width="4"/>
  <circle cx="320" cy="115" r="8" fill="#d8b98a"/>
  
  <!-- Placa de Vídeo GPU -->
  <rect x="255" y="165" width="130" height="32" rx="4" fill="#282834" stroke="#0070f3" stroke-width="2"/>
  <circle cx="285" cy="181" r="10" fill="#111" stroke="#0070f3" stroke-width="2"/>
  <circle cx="325" cy="181" r="10" fill="#111" stroke="#0070f3" stroke-width="2"/>
  <circle cx="365" cy="181" r="10" fill="#111" stroke="#0070f3" stroke-width="2"/>
  
  <!-- Pentes de Memoria RAM RGB -->
  <rect x="360" y="90" width="6" height="35" rx="2" fill="url(#rgbGrad)"/>
  <rect x="370" y="90" width="6" height="35" rx="2" fill="url(#rgbGrad)"/>
  
  <!-- Faixas de LEDs no Gabinete -->
  <line x1="245" y1="240" x2="395" y2="240" stroke="url(#rgbGrad)" stroke-width="3"/>
  
  <text x="320" y="305" fill="#d8b98a" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">MONTAGEM DE COMPUTADORES</text>
  <text x="320" y="328" fill="#888" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Projetos Sob Medida: Gamer, Home Office &amp; Workstations</text>
</svg>
