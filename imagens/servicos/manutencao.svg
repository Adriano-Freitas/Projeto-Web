<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f24"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b98a"/>
      <stop offset="100%" stop-color="#bfa071"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ea8de"/>
      <stop offset="100%" stop-color="#2a6f97"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="12" fill="url(#bgGrad1)" stroke="#333338" stroke-width="2"/>
  
  <!-- Grid de circuitos de fundo -->
  <path d="M 60 80 L 180 80 L 220 120 M 460 80 L 580 80 M 80 280 L 200 280 M 440 280 L 560 280 L 580 260" stroke="#2a2a32" stroke-width="2" fill="none"/>
  <circle cx="220" cy="120" r="4" fill="#bfa071" opacity="0.6"/>
  <circle cx="460" cy="80" r="4" fill="#4ea8de" opacity="0.6"/>
  <circle cx="200" cy="280" r="4" fill="#bfa071" opacity="0.6"/>
  
  <!-- Notebook / Computador Central -->
  <rect x="200" y="90" width="240" height="150" rx="8" fill="#18181c" stroke="#444" stroke-width="3"/>
  <rect x="215" y="105" width="210" height="120" rx="4" fill="#0d0d0f"/>
  
  <!-- Linhas de diagnóstico na tela -->
  <line x1="230" y1="125" x2="350" y2="125" stroke="#4ea8de" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="145" x2="300" y2="145" stroke="#8fd19e" stroke-width="3" stroke-linecap="round"/>
  <line x1="230" y1="165" x2="330" y2="165" stroke="#bfa071" stroke-width="3" stroke-linecap="round"/>
  <circle cx="380" cy="145" r="22" fill="none" stroke="#4ea8de" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="380" cy="145" r="6" fill="#8fd19e"/>
  
  <!-- Base do Notebook -->
  <path d="M 160 240 L 480 240 L 460 255 L 180 255 Z" fill="#282830" stroke="#444" stroke-width="2"/>
  <rect x="290" y="243" width="60" height="5" rx="2" fill="#555"/>
  
  <!-- Ferramenta Chave de Fenda Técnica Cruzada -->
  <g transform="translate(420, 160) rotate(35)">
    <rect x="-8" y="-70" width="16" height="55" rx="3" fill="url(#goldGrad)"/>
    <rect x="-4" y="-15" width="8" height="60" fill="#bbb"/>
    <path d="M -6 45 L 0 55 L 6 45 Z" fill="#888"/>
  </g>
  
  <!-- Engrenagem / Manutencao Badge -->
  <g transform="translate(180, 190)">
    <circle cx="0" cy="0" r="26" fill="#1f1f26" stroke="#bfa071" stroke-width="3"/>
    <path d="M -4 -30 L 4 -30 L 3 -22 L -3 -22 Z M -4 30 L 4 30 L 3 22 L -3 22 Z M -30 -4 L -30 4 L -22 3 L -22 -3 Z M 30 -4 L 30 4 L 22 3 L 22 -3 Z" fill="#bfa071"/>
    <circle cx="0" cy="0" r="10" fill="#121214" stroke="#bfa071" stroke-width="2"/>
  </g>
  
  <text x="320" y="305" fill="#d8b98a" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">MANUTENÇÃO ESPECIALIZADA</text>
  <text x="320" y="328" fill="#888" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Diagnóstico &amp; Conserto de Hardware e Software</text>
</svg>
